x-server: &base_server_setup
  build:
    context: ./
  stdin_open: true
  tty: true
  environment: &base_server_environments
    DEBUG: ${DEBUG:-true}
    APP_ENVIRONMENT: ${APP_ENVIRONMENT:-DEV}
    # Insecure default so CI (no .env) can boot; override in real deployments.
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-ci-insecure-dev-secret-key}
    # Domain configs
    APP_DOMAIN: ${APP_DOMAIN:-http://localhost:8000}
    FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-http://localhost:3000}
    SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-localhost}
    CSRF_COOKIE_DOMAIN: ${CSRF_COOKIE_DOMAIN:-localhost}
    # Postgres
    POSTGRES_DB: ${POSTGRES_DB:-ercs}
    POSTGRES_USER: ${POSTGRES_USER:-postgres}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    POSTGRES_HOST: ${POSTGRES_HOST:-db}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    # Redis / Celery
    CELERY_REDIS_URL: ${CELERY_REDIS_URL:-redis://redis:6379/0}
    CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/1}
    TEST_CACHE_REDIS_URL: ${TEST_CACHE_REDIS_URL:-redis://redis:6379/11}
    # KoboToolbox sync (token is a secret — set KOBO_ACCESS_TOKEN in .env)
    KOBO_DOMAIN: ${KOBO_DOMAIN:-https://kobo.ifrc.org}
    KOBO_ACCESS_TOKEN: ${KOBO_ACCESS_TOKEN:-}
  env_file:
    - path: ${BACKEND_ENV_FILE:-.env}
      required: false
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./:/code/
    - ipython_data_local:/root/.ipython/profile_default # persist ipython data, including ipython history
  depends_on:
    - db
    - redis

x-worker: &base_worker_setup
  <<: *base_server_setup
  restart: unless-stopped
  environment:
    <<: *base_server_environments
    APP_TYPE: "WORKER"

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17-trixie
    environment:
      POSTGRES_DB: ercs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data17:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data


  web:
    <<: *base_server_setup
    command: ["/code/misc/dev/run_web.sh"]
    environment:
      <<: *base_server_environments
      APP_TYPE: "WEB"
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      - db
      - redis

  worker-beat:
    <<: *base_worker_setup
    command: ["/code/misc/dev/run_worker_beat.sh"]

  worker:
    <<: *base_worker_setup
    command: ["/code/misc/dev/run_worker.sh", "--queues", "default"]
    environment:
      <<: *base_server_environments
      APP_TYPE: "WORKER"

  # Long-running document extraction (LLM), kept off the default worker.
  worker-report-llm:
    <<: *base_worker_setup
    command: ["/code/misc/dev/run_worker.sh", "--queues", "report-llm"]

volumes:
  postgres_data17:
  redis_data:
  ipython_data_local:
