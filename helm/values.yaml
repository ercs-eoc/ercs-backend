app:
  environment: PROD
  nameOverride: ercs

  appTypeEnvName: "APP_TYPE"

  # Global Image
  image:
    name: SET-BY-CICD-IMAGE
    tag: SET-BY-CICD-TAG
    imagePullPolicy: IfNotPresent

  # NOTE: DB/cache/broker are supplied externally (operator CRs in
  # ./values/operators.yaml + user secrets); the old bundled
  # postgresql/redis/minio subcharts are gone in banjo-helm 0.4.

  api:
    enabled: true
    containerPort: 80
    command: ["misc/prod/run_web.sh"]
    ingress:
      enabled: true
      # className is not hardcoded; set it per-environment (e.g. values/traefik.yaml).
      className:
      host:
      annotations:
    probes:
      # banjo-utils HealthProbeMiddleware serves /healthz/live/ and /healthz/ready/.
      # Chart defaults (liveness /healthz/live/, readiness+startup /healthz/ready/) apply.
      enabled: true
    resources:
      requests:
        cpu: "0.3"
        memory: 0.4Gi
      limits:
        memory: 1Gi

  worker:
    enabled: true
    queueDefaults:
      commandPrefix:
        - "celery"
        - "-A"
        - "main"
        - "worker"
        - "-l"
        - "INFO"
      # banjo-celery-probe heartbeat wiring (writer via setup_worker_heartbeat,
      # reader via banjo-celery-probe) on a RAM emptyDir.
      extraEnv:
        BANJO_CELERY_HEARTBEAT_FILE: /var/run/celery/worker_heartbeat
      volumes:
        celery-heartbeat: {emptyDir: {medium: Memory, sizeLimit: 1Mi}}
      volumeMounts:
        celery-heartbeat: {mountPath: /var/run/celery}
      probes:
        enabled: true
        liveness:
          exec: {command: [banjo-celery-probe]}
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        startup:
          exec: {command: [banjo-celery-probe]}
          periodSeconds: 5
          failureThreshold: 30
      resources:
        requests:
          cpu: "0.1"
          memory: 0.5Gi
        limits:
          memory: 1Gi
    queues:
      # NOTE: Make sure keys are lowercase
      default:
        enabled: true
        celeryArgs:
          - "-Q"
          - "default"
          - "--concurrency"
          - "1"
          - "--max-tasks-per-child"
          - "10"
      # Long-running document extraction (page-by-page LLM calls, up to 10h).
      report-llm:
        enabled: true
        celeryArgs:
          - "-Q"
          - "report-llm"
          - "--concurrency"
          - "1"
          - "--max-tasks-per-child"
          - "10"
    addons:
      beat:
        enabled: true
        replicaCount: 1
        strategy: {type: Recreate}
        # HeartbeatPersistentScheduler: plain celery beat (no django-celery-beat)
        # that touches the beat heartbeat file each tick for banjo-celery-probe liveness.
        command:
          - "celery"
          - "-A"
          - "main"
          - "beat"
          - "-l"
          - "INFO"
          - "--scheduler"
          - "banjo_utils.celery_health.persistent.HeartbeatPersistentScheduler"
        extraEnv:
          BANJO_CELERY_HEARTBEAT_FILE: /var/run/celery/beat_heartbeat
        volumes:
          celery-heartbeat: {emptyDir: {medium: Memory, sizeLimit: 1Mi}}
        volumeMounts:
          celery-heartbeat: {mountPath: /var/run/celery}
        probes:
          enabled: true
          liveness:
            # PersistentScheduler max_interval is 300s, so keep --max-age above it.
            exec: {command: [banjo-celery-probe, --max-age, "360"]}
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
        resources:
          requests:
            cpu: "0.1"
            memory: 256Mi
          limits:
            memory: 512Mi

  hooks:
    enabled: true
    defaults:
      resources:
        requests:
          cpu: "0.1"
          memory: 1Gi
        limits:
          memory: 2Gi
    jobs:
      # db-migrate and collect-static inherit the chart defaults verbatim
      # (Sync hook @ wave 20). Only wait-for-resources overrides the bare command.
      wait-for-resources:
        command: ["./manage.py", "wait_for_resources", "--db", "--cache", "--celery-broker"]

  cronjobs:
    enabled: false

  # NOTE: Check main/settings.py for all available options
  env:
    APP_RELEASE: "{{ $.Values.image.tag }}"
    APP_ENVIRONMENT: "{{ $.Values.environment }}"
    DEBUG: "false"
    TIME_ZONE: UTC
    # Storage (S3 enabled by default; the local filesystem is ephemeral)
    AWS_S3_ENABLED: "true"
    # Sentry
    SENTRY_ENABLED: "false"
    # Kobo (ERCS EOC Toolkit) — KOBO_ACCESS_TOKEN is a per-environment secret.
    KOBO_DOMAIN: "https://kobo.ifrc.org"
    # App-domain vars (APP_DOMAIN, FRONTEND_DOMAIN, SESSION_COOKIE_DOMAIN,
    # CSRF_COOKIE_DOMAIN) are set per-environment; see main/settings.py for options.

  # NOTE: Check main/settings.py for all available options. Required secrets
  # (DJANGO_SECRET_KEY, POSTGRES_DB/USER/PASSWORD/HOST/PORT, KOBO_ACCESS_TOKEN) are
  # provided per-environment (CICD / values/<env>.yaml), not defaulted here.
  # Celery/Cache Redis URLs are set via extraEnvVars in ./values/operators.yaml.
  secrets: {}

  # NOTE: Operator-managed infra (Dragonfly cache+broker) and the matching
  # extraEnvVars/extraManifests live in ./values/operators.yaml.
