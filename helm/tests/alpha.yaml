# Dummy values injected by cluster operators / CICD at deploy time.
# Only present so the alpha overlay can be rendered standalone for snapshot
# testing (listed in ../tests.yaml).
app:
  image:
    name: local.example.com/toggle-corp/ercs-backend
    tag: develop.xxxxxxxx

  api:
    ingress:
      host: ercs.example.com

  env:
    APP_DOMAIN: https://ercs.example.com
    FRONTEND_DOMAIN: https://ercs-frontend.example.com
    SESSION_COOKIE_DOMAIN: .example.com
    CSRF_COOKIE_DOMAIN: .example.com

  secrets:
    DJANGO_SECRET_KEY: dummy-secret-key
    # Database
    POSTGRES_DB: dummy
    POSTGRES_USER: dummy
    POSTGRES_PASSWORD: dummy
    POSTGRES_HOST: dummy
    POSTGRES_PORT: "5432"
