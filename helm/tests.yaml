# Snapshot test matrix consumed by ./update-snapshots.sh (fugit).
# Each key is a snapshot under ./snapshots/, rendered from values.yaml (base)
# + the listed values files (in order).
#   - values/operators.yaml : operator-managed infra (Dragonfly) + redis env
#   - values/traefik.yaml    : traefik ingress class + body-size Middleware
#   - values/<env>.yaml      : the environment overlay
#   - tests/<key>            : dummy image/domains/secrets for standalone rendering
tests:
  alpha.yaml:
    - values/operators.yaml
    - values/traefik.yaml
    - values/alpha.yaml
    - tests/alpha.yaml
